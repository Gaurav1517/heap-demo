---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heap-demo
  labels:
    app: heap-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: heap-demo

  template:
    metadata:
      labels:
        app: heap-demo

    spec:
      nodeSelector:
        kubernetes.io/hostname: control-plane

      containers:
        - name: heap-demo
          image: gauravcloud000/k8s-heap-demo:1.0

          command:
            - node

          args:
            - "--max-old-space-size=32"
            - "--heapsnapshot-near-heap-limit=3"
            - "--heapsnapshot-signal=SIGUSR2"
            - "--diagnostic-dir=/snapshots"
            - "/app/server.js"

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          volumeMounts:
            - name: heap-snapshots
              mountPath: /snapshots

      volumes:
        - name: heap-snapshots
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: heap-demo

spec:
  type: NodePort

  selector:
    app: heap-demo

  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
...