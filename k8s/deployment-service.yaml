---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heap-demo
  labels:
    app: heap-demo
spec:
  replicas: 2

  selector:
    matchLabels:
      app: heap-demo

  template:
    metadata:
      labels:
        app: heap-demo

    spec:
      containers:
        - name: heap-demo
          image: gauravcloud000/k8s-heap-demo:1.0

          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: heap-demo
spec:
  type: NodePort

  selector:
    app: heap-demo

  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080
...